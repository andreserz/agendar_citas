openapi: 3.0.3
info:
  title: citas_service — API de reserva y compra de boletos
  version: 1.0.0
  description: |
    Contrato `1.0.0` de `citas_service` para `citas_web_1` y `citas_web_2`.
    Fuente: capacidad `contrato-entre-capas` del change de OpenSpec `impl-service`.
    Un cambio en rutas, formas o códigos de error requiere un change nuevo de OpenSpec;
    un cambio incompatible se publica como `/api/v2`.

    Convenciones:
    - Toda petición a `/api/v1`, excepto `GET /salud`, incluye `X-Sitio` con `web_1` o `web_2`.
      Si falta o no es válido → `400 SOLICITUD_INVALIDA` con `detalles.campo = "X-Sitio"`.
    - Identidad por sitio: `web_1` (`RequiereComprador = 1`) exige `Authorization: Bearer <token>`
      en las operaciones de comprador; `web_2` (`RequiereComprador = 0`) no usa token y sus
      reservas se identifican por un `id` UUID v4. En la tabla de rutas esto se marca «Según sitio».
    - Fechas en ISO 8601 con desplazamiento explícito de Ciudad de México, por ejemplo
      `2026-11-12T19:00:00-06:00`.
    - Montos en unidades de la moneda (pesos), acompañados de `moneda` (`MXN` en ambos sitios).
    - Los campos opcionales se omiten cuando no aplican; no se envían como `null`.

    Errores: todas las respuestas de error usan el esquema `Error`, con `mensaje` en español.
    `409` = conflicto de disponibilidad o de estado; `410` = la reserva ya no está vigente.
  contact:
    name: Equipo citas_service (líder de contrato)
servers:
  - url: http://localhost:3000/api/v1
    description: Local
tags:
  - name: Salud
    description: Estado del servicio. No requiere `X-Sitio`.
  - name: Catálogo
    description: Eventos, funciones y asientos del sitio. No requiere comprador.
  - name: Reservas
    description: Apartado de asientos por 5 minutos.
  - name: Pagos
    description: Pago simulado de una reserva con tarjetas de prueba.
  - name: Órdenes
    description: Compras concluidas y boletos.
  - name: Reportes
    description: Conteos para el sitio.
  - name: Autenticación
    description: Cuentas de comprador (solo las usa `web_1`).

security:
  - sitio: []

paths:
  /salud:
    get:
      tags: [Salud]
      operationId: obtenerSalud
      summary: Estado del servicio
      description: No requiere `X-Sitio`.
      security: []
      responses:
        '200':
          description: El servicio responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
              example:
                estado: ok
                repositorio: memoria

  /eventos:
    get:
      tags: [Catálogo]
      operationId: listarEventos
      summary: Listar eventos del sitio
      description: Solo eventos con `sitio` igual a `X-Sitio`.
      responses:
        '200':
          description: Eventos del sitio que hace la petición.
          content:
            application/json:
              schema:
                type: object
                required: [eventos]
                properties:
                  eventos:
                    type: array
                    items: { $ref: '#/components/schemas/Evento' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /eventos/{eventoId}:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    get:
      tags: [Catálogo]
      operationId: obtenerEvento
      summary: Obtener un evento
      description: Un evento de otro sitio responde `404`.
      responses:
        '200':
          description: Evento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /eventos/{eventoId}/funciones:
    parameters:
      - $ref: '#/components/parameters/EventoId'
    get:
      tags: [Catálogo]
      operationId: listarFunciones
      summary: Listar funciones de un evento
      description: Funciones activas ordenadas por `inicio`.
      responses:
        '200':
          description: Funciones del evento.
          content:
            application/json:
              schema:
                type: object
                required: [funciones]
                properties:
                  funciones:
                    type: array
                    items: { $ref: '#/components/schemas/Funcion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /funciones/{funcionId}:
    parameters:
      - $ref: '#/components/parameters/FuncionId'
    get:
      tags: [Catálogo]
      operationId: obtenerFuncion
      summary: Obtener una función
      description: Función con sus zonas y precios.
      responses:
        '200':
          description: Función.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /funciones/{funcionId}/asientos:
    parameters:
      - $ref: '#/components/parameters/FuncionId'
    get:
      tags: [Catálogo]
      operationId: listarAsientos
      summary: Mapa de asientos de una función
      description: |
        El `estado` de cada asiento se calcula con la hora del servidor, en este orden:
        1. Tiene boleto → `comprado`.
        2. Tiene una reserva `activa` con `expiraEn > ahora` → `apartado`.
        3. En otro caso → `disponible`.

        La comparación es estricta: en `ahora = expiraEn` el asiento está `disponible`.
        La respuesta no revela quién aparta o compra un asiento.
      responses:
        '200':
          description: Zonas y asientos de la función.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapaAsientos' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /reservas:
    post:
      tags: [Reservas]
      operationId: crearReserva
      summary: Apartar asientos (5 minutos)
      description: |
        «Según sitio»: `web_1` exige token; `web_2` no.
        Validaciones en este orden:
        1. Formato: entre 1 y 10 asientos sin repetidos → `400 SOLICITUD_INVALIDA`.
        2. Identidad según sitio → `401 NO_AUTENTICADO`.
        3. Existencia de función y asientos → `404 NO_ENCONTRADO`; asientos de funciones
           distintas → `400 SOLICITUD_INVALIDA`.
        4. Límite (solo `web_1`): comprados + apartados vigentes + solicitados ≤ 10
           → `422 LIMITE_EXCEDIDO`.
        5. Disponibilidad → `409 ASIENTO_NO_DISPONIBLE` con todos los asientos en conflicto;
           ninguno queda apartado.
        6. Creación → `201` con `Location`.

        `expiraEn = creadaEn + 300 s` con el reloj del servicio. El precio de cada asiento se
        toma de su zona en la función al apartar y no cambia durante la vigencia. La operación
        es atómica.
      security:
        - sitio: []
          comprador: []
        - sitio: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaReserva' }
            example:
              funcionId: fun-2026-11-12-1900
              asientoIds: [A7, A8]
      responses:
        '201':
          description: Reserva creada.
          headers:
            Location:
              description: URL de la reserva creada (`/api/v1/reservas/{id}`).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Uno o más asientos no están disponibles. `codigo` = `ASIENTO_NO_DISPONIBLE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: ASIENTO_NO_DISPONIBLE
                  mensaje: Algunos asientos ya no están disponibles.
                  detalles:
                    asientoIds: [A8]
        '422':
          description: |
            Se superaría el máximo de 10 asientos por comprador y función. Solo aplica a sitios
            con `RequiereComprador = 1` (`web_1`). `codigo` = `LIMITE_EXCEDIDO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: LIMITE_EXCEDIDO
                  mensaje: Solo puedes tener 10 asientos en esta función.
                  detalles:
                    maximo: 10
                    actuales: 9
                    solicitados: 2
        '500': { $ref: '#/components/responses/ErrorInterno' }
    get:
      tags: [Reservas]
      operationId: listarMisReservas
      summary: Reservas activas del comprador
      description: Solo para sitios con `RequiereComprador = 1` (`web_1`). Requiere token.
      security:
        - sitio: []
          comprador: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [activa]
            default: activa
      responses:
        '200':
          description: Reservas activas y vigentes del comprador autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [reservas]
                properties:
                  reservas:
                    type: array
                    items: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /reservas/{reservaId}:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    get:
      tags: [Reservas]
      operationId: obtenerReserva
      summary: Consultar una reserva
      description: |
        «Según sitio». Incluye `segundosRestantes` para la cuenta regresiva. Una reserva de
        otro sitio o de otro comprador responde `404` para no revelar que existe.
      security:
        - sitio: []
          comprador: []
        - sitio: []
      responses:
        '200':
          description: Reserva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      tags: [Reservas]
      operationId: liberarReserva
      summary: Liberar una reserva
      description: |
        «Según sitio».
        - `activa` y vigente → `204`; sus asientos vuelven a `disponible`.
        - `activa` con `expiraEn <= ahora` → `410 RESERVA_VENCIDA`; no se libera.
        - `pagada` → `409 RESERVA_PAGADA`.
        - `liberada` → `410 RESERVA_LIBERADA`.
        - Inexistente o de otro sitio o comprador → `404 NO_ENCONTRADO`.
      security:
        - sitio: []
          comprador: []
        - sitio: []
      responses:
        '204':
          description: Reserva liberada; sus asientos vuelven a estar disponibles.
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReservaPagada' }
        '410': { $ref: '#/components/responses/ReservaNoVigente' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /reservas/{reservaId}/pago:
    parameters:
      - $ref: '#/components/parameters/ReservaId'
    post:
      tags: [Pagos]
      operationId: pagarReserva
      summary: Pago simulado de una reserva
      description: |
        «Según sitio». Solo se aceptan dos números de tarjeta de prueba:
        - `4242 4242 4242 4242` → aprobado.
        - `4000 0000 0000 0002` → rechazado.

        Otro número, o un error de formato en `titular`, `vencimiento` (`MM/AA`, no vencido)
        o `cvv` (3 dígitos) → `400 SOLICITUD_INVALIDA` con `detalles.campo`; no se registra
        intento.

        Resultados sobre una reserva `activa` y vigente (ambos responden `201`):
        - Aprobado: en una sola operación atómica se registra el intento, la reserva pasa a
          `pagada`, se crea la orden con sus boletos y los asientos quedan `comprado`.
        - Rechazado: se registra el intento; la reserva sigue `activa` y `expiraEn` no cambia.
          Se puede reintentar mientras siga vigente.

        El servicio nunca guarda el número completo ni el CVV; el intento guarda solo los
        últimos 4 dígitos.
      security:
        - sitio: []
          comprador: []
        - sitio: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPago' }
            examples:
              aprobado:
                value:
                  numeroTarjeta: 4242 4242 4242 4242
                  titular: Ana López
                  vencimiento: 12/28
                  cvv: '123'
              rechazado:
                value:
                  numeroTarjeta: 4000 0000 0000 0002
                  titular: Ana López
                  vencimiento: 12/28
                  cvv: '123'
      responses:
        '201':
          description: Intento de pago registrado. El resultado viene en `resultado`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pago' }
        '400':
          description: |
            Tarjeta que no es de prueba o datos con formato incorrecto. `codigo` = `SOLICITUD_INVALIDA`.
            No se registra intento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: SOLICITUD_INVALIDA
                  mensaje: Usa una de las tarjetas de prueba.
                  detalles:
                    campo: numeroTarjeta
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ReservaPagada' }
        '410': { $ref: '#/components/responses/ReservaNoVigente' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /ordenes:
    get:
      tags: [Órdenes]
      operationId: listarMisOrdenes
      summary: Órdenes del comprador
      description: Solo para sitios con `RequiereComprador = 1` (`web_1`). Requiere token.
      security:
        - sitio: []
          comprador: []
      responses:
        '200':
          description: Órdenes del comprador autenticado, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [ordenes]
                properties:
                  ordenes:
                    type: array
                    items: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /ordenes/buscar:
    get:
      tags: [Órdenes]
      operationId: buscarOrden
      summary: Recuperar una compra sin cuenta
      description: |
        Se envía exactamente uno de `folio` o `codigo` (código de un boleto). Ninguno o ambos
        → `400 SOLICITUD_INVALIDA`. Se filtra por el sitio de `X-Sitio`: una orden inexistente
        o de otro sitio → `404 NO_ENCONTRADO`.
      parameters:
        - name: folio
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Folio' }
        - name: codigo
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CodigoBoleto' }
      responses:
        '200':
          description: Orden con sus boletos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /ordenes/{ordenId}:
    parameters:
      - name: ordenId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Órdenes]
      operationId: obtenerOrden
      summary: Consultar una orden y sus boletos
      description: «Según sitio». Una orden de otro sitio o de otro comprador responde `404`.
      security:
        - sitio: []
          comprador: []
        - sitio: []
      responses:
        '200':
          description: Orden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /reportes/reservas-por-dia:
    get:
      tags: [Reportes]
      operationId: contarReservasPorDia
      summary: Conteo de reservas por día
      description: |
        Número de reservas creadas por día calendario en `America/Mexico_City`, sin importar
        su estado final y sin desglose por sala. Se cuenta solo el sitio de `X-Sitio`.
        El rango máximo es de 92 días; un rango mayor o inválido → `400 SOLICITUD_INVALIDA`.
      parameters:
        - name: desde
          in: query
          required: true
          description: Primer día del rango (AAAA-MM-DD, hora de CDMX).
          schema: { type: string, format: date, example: '2026-11-19' }
        - name: hasta
          in: query
          required: true
          description: Último día del rango, inclusive (AAAA-MM-DD, hora de CDMX).
          schema: { type: string, format: date, example: '2026-11-25' }
      responses:
        '200':
          description: Conteo por día.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservasPorDia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/registro:
    post:
      tags: [Autenticación]
      operationId: registrarComprador
      summary: Registrar comprador
      description: |
        Crea la cuenta y devuelve un token JWT (HS256, 8 horas). La contraseña se guarda
        como hash calculado en el servicio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoComprador' }
      responses:
        '201':
          description: Comprador registrado y con sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409':
          description: El correo ya está registrado. `codigo` = `CORREO_REGISTRADO`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  codigo: CORREO_REGISTRADO
                  mensaje: Ese correo ya tiene una cuenta.
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Cualquier fallo de credenciales responde `401 NO_AUTENTICADO` con el mismo mensaje,
        sin indicar si falló el correo o la contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciales' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

components:
  securitySchemes:
    sitio:
      type: apiKey
      in: header
      name: X-Sitio
      description: |
        Identifica al sitio consumidor. Valores permitidos: `web_1` o `web_2`. No es una llave
        secreta. Obligatorio en toda petición a `/api/v1` excepto `GET /salud`.
    comprador:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT HS256 emitido por `/auth/registro` o `/auth/login`, con `sub` = id del
        comprador y expiración de 8 horas. Obligatorio en las operaciones de comprador de los
        sitios con `RequiereComprador = 1` (`web_1`).

  parameters:
    EventoId:
      name: eventoId
      in: path
      required: true
      schema: { type: string }
    FuncionId:
      name: funcionId
      in: path
      required: true
      schema: { type: string }
    ReservaId:
      name: reservaId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    SolicitudInvalida:
      description: |
        Datos faltantes o con formato incorrecto, JSON mal formado, o `X-Sitio` ausente o no
        válido. `codigo` = `SOLICITUD_INVALIDA`; `detalles.campo` indica el dato.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              codigo: SOLICITUD_INVALIDA
              mensaje: Falta el encabezado X-Sitio o no es válido.
              detalles:
                campo: X-Sitio
    NoAutenticado:
      description: |
        Falta el token del comprador, es inválido o las credenciales no coinciden.
        `codigo` = `NO_AUTENTICADO`. No revela si el correo existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              codigo: NO_AUTENTICADO
              mensaje: Inicia sesión para continuar.
    NoEncontrado:
      description: |
        El recurso no existe o pertenece a otro sitio o comprador. `codigo` = `NO_ENCONTRADO`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              codigo: NO_ENCONTRADO
              mensaje: El recurso solicitado no existe.
    ReservaPagada:
      description: La reserva ya fue pagada. `codigo` = `RESERVA_PAGADA`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              codigo: RESERVA_PAGADA
              mensaje: Esta reserva ya fue pagada.
    ReservaNoVigente:
      description: |
        La reserva ya no está vigente. `codigo` = `RESERVA_VENCIDA` si pasó su `expiraEn`,
        o `RESERVA_LIBERADA` si fue liberada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            vencida:
              value:
                error:
                  codigo: RESERVA_VENCIDA
                  mensaje: La reserva venció; vuelve a seleccionar tus asientos.
            liberada:
              value:
                error:
                  codigo: RESERVA_LIBERADA
                  mensaje: La reserva ya fue liberada.
    ErrorInterno:
      description: |
        Error no previsto, incluidos los códigos de base de datos no mapeados.
        `codigo` = `ERROR_INTERNO`. No incluye detalles de la base de datos ni trazas.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: Ocurrió un error inesperado.

  schemas:
    Error:
      type: object
      required: [error]
      description: |
        Formato único de error. Traducción de los códigos de base de datos:

        | Base de datos | HTTP | `codigo` |
        | --- | --- | --- |
        | 51001 | 409 | `ASIENTO_NO_DISPONIBLE` |
        | 51002 | 409 | `CORREO_REGISTRADO` |
        | 51003 | 409 | `RESERVA_PAGADA` |
        | 52001 | 410 | `RESERVA_VENCIDA` |
        | 52002 | 410 | `RESERVA_LIBERADA` |
        | 53001 | 422 | `LIMITE_EXCEDIDO` |
        | 53002, 53003, 53008 | 400 | `SOLICITUD_INVALIDA` |
        | 53004 | 500 | `ERROR_INTERNO` |
        | 53005, 53006, 53007 | 400 | `SOLICITUD_INVALIDA` |
        | 54001–54005 | 404 | `NO_ENCONTRADO` |
        | 50000 o no mapeado | 500 | `ERROR_INTERNO` |
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              description: Código estable para que el sitio decida qué mostrar.
              enum:
                - SOLICITUD_INVALIDA
                - NO_AUTENTICADO
                - NO_ENCONTRADO
                - ASIENTO_NO_DISPONIBLE
                - CORREO_REGISTRADO
                - RESERVA_PAGADA
                - RESERVA_VENCIDA
                - RESERVA_LIBERADA
                - LIMITE_EXCEDIDO
                - ERROR_INTERNO
            mensaje:
              type: string
              description: Texto en español apto para mostrar al usuario. Sin datos de otro comprador ni trazas.
            detalles:
              type: object
              additionalProperties: true
              description: Información adicional según el código (por ejemplo, `campo` o `asientoIds`).

    Sitio:
      type: string
      enum: [web_1, web_2]

    Dinero:
      type: number
      minimum: 0
      description: Monto en unidades de la moneda indicada (pesos).

    Moneda:
      type: string
      description: Código ISO 4217.
      enum: [MXN]
      example: MXN

    FechaHora:
      type: string
      format: date-time
      description: ISO 8601 con desplazamiento de Ciudad de México.
      example: '2026-11-12T19:00:00-06:00'

    Folio:
      type: string
      pattern: '^ORD-[0-9]{6}$'
      description: Folio visible de la orden.
      example: ORD-000123

    CodigoBoleto:
      type: string
      pattern: '^[A-Z2-9]{12}$'
      description: Código único del boleto; el sitio lo dibuja como QR.
      example: 7KQ2M9XD4TPA

    Salud:
      type: object
      required: [estado, repositorio]
      properties:
        estado:
          type: string
          enum: [ok]
        repositorio:
          type: string
          enum: [memoria, sql]

    Evento:
      type: object
      required: [id, sitio, nombre]
      properties:
        id: { type: string, example: evt-suegra }
        sitio: { $ref: '#/components/schemas/Sitio' }
        nombre: { type: string, example: ¡Que no se entere la suegra! }
        recinto: { type: string, example: Teatro Aquí nadie actúa normal }
        descripcion: { type: string }

    Zona:
      type: object
      required: [id, nombre, precio, moneda]
      properties:
        id: { type: string, example: preferente }
        nombre: { type: string, example: Preferente }
        precio: { $ref: '#/components/schemas/Dinero' }
        moneda: { $ref: '#/components/schemas/Moneda' }

    Funcion:
      type: object
      required: [id, eventoId, inicio, zonas]
      properties:
        id: { type: string, example: fun-2026-11-12-1900 }
        eventoId: { type: string, example: evt-suegra }
        inicio: { $ref: '#/components/schemas/FechaHora' }
        formato: { type: string, example: 2D }
        idioma: { type: string, example: Por confirmar }
        clasificacion: { type: string, example: Por confirmar }
        duracionMinutos: { type: integer, minimum: 1 }
        zonas:
          type: array
          description: Zonas de la función con su precio.
          items: { $ref: '#/components/schemas/Zona' }

    EstadoAsiento:
      type: string
      enum: [disponible, apartado, comprado]
      description: Calculado al consultar con la hora del servidor.

    Asiento:
      type: object
      required: [id, zonaId, fila, numero, etiqueta, precio, estado]
      properties:
        id: { type: string, example: A7 }
        zonaId: { type: string, example: preferente }
        fila: { type: string, example: A }
        numero: { type: integer, example: 7 }
        etiqueta: { type: string, description: Texto para mostrar., example: A7 }
        precio: { $ref: '#/components/schemas/Dinero' }
        estado: { $ref: '#/components/schemas/EstadoAsiento' }

    MapaAsientos:
      type: object
      required: [funcion, zonas, asientos, consultadoEn]
      properties:
        funcion: { $ref: '#/components/schemas/Funcion' }
        zonas:
          type: array
          items: { $ref: '#/components/schemas/Zona' }
        asientos:
          type: array
          items: { $ref: '#/components/schemas/Asiento' }
        consultadoEn:
          allOf:
            - $ref: '#/components/schemas/FechaHora'
          description: Hora del servicio a la que se calcularon los estados.

    NuevaReserva:
      type: object
      required: [funcionId, asientoIds]
      properties:
        funcionId: { type: string }
        asientoIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string }

    AsientoReservado:
      type: object
      required: [asientoId, etiqueta, zonaId, precio]
      properties:
        asientoId: { type: string, example: A7 }
        etiqueta: { type: string, example: A7 }
        zonaId: { type: string, example: preferente }
        precio:
          allOf:
            - $ref: '#/components/schemas/Dinero'
          description: Precio tomado al crear la reserva; no cambia durante la vigencia.

    EstadoReserva:
      type: string
      enum: [activa, vencida, liberada, pagada]
      description: "`vencida` se calcula al consultar: reserva `activa` con `expiraEn <= ahora`."

    Reserva:
      type: object
      required: [id, sitio, funcionId, estado, asientos, total, moneda, creadaEn, expiraEn, segundosRestantes]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4, no adivinable.
          example: 3f2b8c1e-7a4d-4e9b-9c1a-2d5e6f7a8b9c
        sitio: { $ref: '#/components/schemas/Sitio' }
        funcionId: { type: string, example: fun-2026-11-12-1900 }
        estado: { $ref: '#/components/schemas/EstadoReserva' }
        asientos:
          type: array
          items: { $ref: '#/components/schemas/AsientoReservado' }
        total:
          allOf:
            - $ref: '#/components/schemas/Dinero'
          description: Suma de los precios de los asientos.
        moneda: { $ref: '#/components/schemas/Moneda' }
        creadaEn: { $ref: '#/components/schemas/FechaHora' }
        expiraEn:
          allOf:
            - $ref: '#/components/schemas/FechaHora'
          description: "`creadaEn` + 300 segundos, con el reloj del servicio."
        segundosRestantes:
          type: integer
          minimum: 0
          description: |
            Segundos hasta `expiraEn` según el reloj del servicio; 0 si no está activa y vigente.
            Úsalo para la cuenta regresiva en lugar del reloj del navegador.
        ordenId:
          type: string
          description: Presente solo cuando la reserva está pagada.

    NuevoPago:
      type: object
      required: [numeroTarjeta, titular, vencimiento, cvv]
      properties:
        numeroTarjeta:
          type: string
          description: |
            Solo tarjetas de prueba: `4242 4242 4242 4242` (aprobado) o
            `4000 0000 0000 0002` (rechazado).
          example: 4242 4242 4242 4242
        titular:
          type: string
          minLength: 1
          example: Ana López
        vencimiento:
          type: string
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
          description: "`MM/AA`, no vencido."
          example: 12/28
        cvv:
          type: string
          pattern: '^[0-9]{3}$'
          example: '123'

    Pago:
      type: object
      required: [resultado, simulado, reserva]
      properties:
        resultado:
          type: string
          enum: [aprobado, rechazado]
        simulado:
          type: boolean
          enum: [true]
          description: Siempre `true`; el sitio debe indicar que el pago es simulado.
        reserva:
          allOf:
            - $ref: '#/components/schemas/Reserva'
          description: |
            Reserva después del intento: `pagada` si se aprobó, `activa` si se rechazó.
        orden:
          allOf:
            - $ref: '#/components/schemas/Orden'
          description: Presente solo si `resultado` es `aprobado`.

    Boleto:
      type: object
      required: [codigo, etiqueta, zonaId, precio, eventoNombre, inicio]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoBoleto' }
        etiqueta: { type: string, example: A7 }
        zonaId: { type: string, example: preferente }
        precio: { $ref: '#/components/schemas/Dinero' }
        eventoNombre: { type: string, example: ¡Que no se entere la suegra! }
        inicio: { $ref: '#/components/schemas/FechaHora' }

    Orden:
      type: object
      required: [id, folio, reservaId, sitio, fecha, total, moneda, boletos]
      properties:
        id: { type: string }
        folio: { $ref: '#/components/schemas/Folio' }
        reservaId: { type: string, format: uuid }
        sitio: { $ref: '#/components/schemas/Sitio' }
        fecha: { $ref: '#/components/schemas/FechaHora' }
        total: { $ref: '#/components/schemas/Dinero' }
        moneda: { $ref: '#/components/schemas/Moneda' }
        boletos:
          type: array
          items: { $ref: '#/components/schemas/Boleto' }
      example:
        id: ord-7c1e
        folio: ORD-000123
        reservaId: 3f2b8c1e-7a4d-4e9b-9c1a-2d5e6f7a8b9c
        sitio: web_1
        fecha: '2026-11-12T18:42:10-06:00'
        total: 1600
        moneda: MXN
        boletos:
          - codigo: 7KQ2M9XD4TPA
            etiqueta: A7
            zonaId: preferente
            precio: 800
            eventoNombre: ¡Que no se entere la suegra!
            inicio: '2026-11-12T19:00:00-06:00'
          - codigo: HN4R8WZ3C6EB
            etiqueta: A8
            zonaId: preferente
            precio: 800
            eventoNombre: ¡Que no se entere la suegra!
            inicio: '2026-11-12T19:00:00-06:00'

    ReservasPorDia:
      type: object
      required: [sitio, desde, hasta, dias]
      description: |
        Forma de respuesta definida por el servicio: el contrato compartido fija el conteo
        (reservas creadas por día en CDMX, sin importar su estado), no el envoltorio.
      properties:
        sitio: { $ref: '#/components/schemas/Sitio' }
        desde: { type: string, format: date, example: '2026-11-19' }
        hasta: { type: string, format: date, example: '2026-11-25' }
        dias:
          type: array
          items:
            type: object
            required: [fecha, reservas]
            properties:
              fecha: { type: string, format: date, example: '2026-11-19' }
              reservas:
                type: integer
                minimum: 0
                description: Reservas creadas ese día, sin importar su estado final.

    NuevoComprador:
      type: object
      required: [nombre, correo, contrasena]
      properties:
        nombre: { type: string, minLength: 1 }
        correo: { type: string, format: email }
        contrasena: { type: string, format: password, minLength: 8 }

    Credenciales:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email }
        contrasena: { type: string, format: password }

    Comprador:
      type: object
      required: [id, nombre, correo]
      properties:
        id: { type: string }
        nombre: { type: string }
        correo: { type: string, format: email }

    Sesion:
      type: object
      required: [comprador, token]
      properties:
        comprador: { $ref: '#/components/schemas/Comprador' }
        token:
          type: string
          description: "JWT para el encabezado `Authorization: Bearer <token>`."
